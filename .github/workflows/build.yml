name: Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact-name: TeeVisuals-windows-x64
            package-file: TeeVisuals-windows-x64.zip
          - name: linux-x64
            os: ubuntu-24.04
            artifact-name: TeeVisuals-linux-x64
            package-file: TeeVisuals-linux-x64.tar.xz
          - name: macos
            os: macos-latest
            artifact-name: TeeVisuals-macos
            package-file: TeeVisuals-macos.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Prepare Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcovr \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libglew-dev \
            libnotify-dev \
            libogg-dev \
            libopus-dev \
            libopusfile-dev \
            libpng-dev \
            libsdl2-dev \
            libsqlite3-dev \
            libswresample-dev \
            libswscale-dev \
            libwavpack-dev \
            libx264-dev \
            libvulkan-dev \
            ninja-build \
            pkg-config \
            valgrind \
            glslang-tools \
            spirv-tools

      - name: Prepare macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ffmpeg molten-vk ninja pkg-config sdl2 libogg opus opusfile freetype
          pip3 install --break-system-packages dmgbuild pyobjc-framework-Quartz

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DVULKAN=ON -DDISCORD=OFF -DCLIENT_EXECUTABLE=TeeVisuals -DPREFER_BUNDLED_LIBS=ON

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVULKAN=ON -DDISCORD=OFF -DCLIENT_EXECUTABLE=TeeVisuals -DPREFER_BUNDLED_LIBS=ON

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVULKAN=ON -DDISCORD=OFF -DCLIENT_EXECUTABLE=TeeVisuals -DPREFER_BUNDLED_LIBS=ON

      - name: Build & Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build build --config Release --target package_default
          New-Item -ItemType Directory -Path artifacts -Force
          $zip = Get-ChildItem -Path build -Filter "*.zip" | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName artifacts/TeeVisuals-windows-x64.zip
          } else {
            New-Item -ItemType Directory -Path pack_win/TeeVisuals -Force
            Copy-Item build/Release/TeeVisuals.exe pack_win/TeeVisuals/ -ErrorAction SilentlyContinue
            Copy-Item build/TeeVisuals.exe pack_win/TeeVisuals/ -ErrorAction SilentlyContinue
            Copy-Item -Recurse data pack_win/TeeVisuals/data
            Copy-Item build/Release/*.dll pack_win/TeeVisuals/ -ErrorAction SilentlyContinue
            Copy-Item build/*.dll pack_win/TeeVisuals/ -ErrorAction SilentlyContinue
            Copy-Item ddnet-libs/windows/lib64/*.dll pack_win/TeeVisuals/ -ErrorAction SilentlyContinue
            Compress-Archive -Path pack_win/TeeVisuals -DestinationPath artifacts/TeeVisuals-windows-x64.zip
          }

      - name: Build & Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --config Release --target package_default
          mkdir -p artifacts
          tar_file=$(find build -name "*.tar.xz" | head -n 1)
          if [ -n "$tar_file" ]; then
            cp "$tar_file" artifacts/TeeVisuals-linux-x64.tar.xz
          else
            mkdir -p pack_linux/TeeVisuals
            cp build/TeeVisuals pack_linux/TeeVisuals/
            cp -r data pack_linux/TeeVisuals/
            tar -cJf artifacts/TeeVisuals-linux-x64.tar.xz -C pack_linux TeeVisuals
          fi

      - name: Build & Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --build build --config Release --target package_default
          mkdir -p artifacts
          dmg_file=$(find build -name "*.dmg" | head -n 1)
          if [ -n "$dmg_file" ]; then
            cp "$dmg_file" artifacts/TeeVisuals-macos.dmg
          else
            mkdir -p pack_mac
            cp -R build/TeeVisuals.app pack_mac/
            hdiutil create -volname "TeeVisuals" -srcfolder pack_mac -ov -format UDZO artifacts/TeeVisuals-macos.dmg
          fi

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/*
          if-no-files-found: warn

  build-android:
    runs-on: ubuntu-24.04
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Linux & Rust for Android
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build openjdk-21-jdk openssl wget unzip
          curl -LO https://github.com/Kitware/CMake/releases/download/v3.22.1/cmake-3.22.1-Linux-x86_64.tar.gz
          mkdir -p /home/runner/cmake
          tar --strip-components 1 -C /home/runner/cmake -xf cmake-3.22.1-Linux-x86_64.tar.gz
          rustup default stable
          cargo install cargo-ndk --version 3.5.4 || cargo install cargo-ndk
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
          chmod -R +x scripts
          bash scripts/android/download_android_sdk.sh /home/runner

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Build Android APK
        env:
          TW_KEY_NAME: /home/runner/TeeVisuals.jks
          TW_KEY_ALIAS: TeeVisuals-Key
        run: |
          export TW_KEY_PW="$(openssl rand -base64 32)"
          keytool -genkey -v -keystore "$TW_KEY_NAME" -keyalg RSA -keysize 2048 -validity 10000 -alias "$TW_KEY_ALIAS" -storepass "$TW_KEY_PW" -dname "CN=TeeVisuals CI, OU=TeeVisuals, O=TeeVisuals"
          export ANDROID_HOME="/home/runner/Android/Sdk"
          unset ANDROID_SDK_ROOT
          export PATH=/home/runner/cmake/bin:$PATH
          chmod -R +x scripts
          bash scripts/android/cmake_android.sh all TeeVisuals org.teevisuals.client Release build-android
          mkdir -p artifacts
          find build-android -name "*.apk" -exec cp {} artifacts/TeeVisuals-android.apk \;

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeeVisuals-android
          path: artifacts/TeeVisuals-android.apk
          if-no-files-found: warn

  build-ios:
    runs-on: macos-latest
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode and Rust for iOS
        run: |
          xcodebuild -version
          rustup default stable
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          chmod -R +x scripts

      - name: Build iOS App
        run: |
          bash scripts/ios/cmake_ios.sh device TeeVisuals org.teevisuals.client Release build-ios-device

      - name: Package iOS IPA (Unsigned / TrollStore / Sideloading)
        run: |
          mkdir -p artifacts Payload
          if [ -d "build-ios-device/Release-iphoneos/TeeVisuals.app" ]; then
            cp -R build-ios-device/Release-iphoneos/TeeVisuals.app Payload/
          else
            APP_PATH=$(find build-ios-device -name "*.app" -type d | head -n 1)
            cp -R "$APP_PATH" Payload/
          fi
          zip -qry artifacts/TeeVisuals-ios.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeeVisuals-ios
          path: artifacts/TeeVisuals-ios.ipa
          if-no-files-found: warn

  release:
    needs: [build-desktop, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten release artifacts
        run: |
          mkdir -p release-files
          find release-artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
